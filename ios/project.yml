# Lineup Lab for iPhone and iPad. Generate the Xcode project with:  ~/.local/bin/xcodegen --spec ios/project.yml
# (the .xcodeproj is generated, never hand-edited; see docs/superpowers/specs/2026-11-17-ios-app-design.md)
name: LineupLab
options:
  bundleIdPrefix: com.haydenjohnstonwoods
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Z7AKF9V84C    # HAYDEN FINLEY JOHNSTON WOODS (individual); automatic signing
    CODE_SIGN_STYLE: Automatic
targets:
  LineupLab:
    type: application
    platform: iOS
    sources:
      - path: LineupLab
    resources: []
    entitlements:
      path: LineupLab/LineupLab.entitlements
      properties:
        aps-environment: development          # Xcode switches this to production for App Store builds
        com.apple.developer.applesignin: [Default]
    info:
      path: LineupLab/Info.plist
      properties:
        CFBundleDisplayName: Lineup Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false      # HTTPS only: exempt, no export-compliance paperwork
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.haydenjohnstonwoods.lineuplab.auth
            CFBundleURLSchemes: [lineuplab]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haydenjohnstonwoods.lineuplab
        TARGETED_DEVICE_FAMILY: "1,2"             # iPhone and iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: false
        ENABLE_PREVIEWS: true
